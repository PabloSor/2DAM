name: flutter_final_project
description: "Aplicación de productos con Firebase"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  
  # FlutterFire y Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: 5.6.5
  google_sign_in: ^6.2.2

  # Paquete para peticiones HTTP
  http: ^1.3.0

  # Internacionalización
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
 
  # Provider para manejo de estado
  provider: ^6.0.5

  # Google Fonts para mejorar la UI
  google_fonts: ^6.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


